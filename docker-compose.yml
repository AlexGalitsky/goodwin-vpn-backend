services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: plane
      POSTGRES_DB: plane
    ports:
      - "5432:5432"
    volumes:
      - plane-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plane -d plane"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  plane-pg:
